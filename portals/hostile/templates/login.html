{% extends "base.html" %}
{% block title %}Sign in - GazSfera{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-header">System sign-in</div>
    <div class="login-body">
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}

      <form method="post" action="/login">
        <div class="form-row">
          <label>Username <span class="req">*</span></label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="form-row">
          <label>Password <span class="req">*</span></label>
          <input type="password" name="password" required>
        </div>
        <div class="form-row">
          <label>Client VAT ID <span class="req">*</span></label>
          <input type="text" name="nip" required placeholder="10 digits">
        </div>
        <div class="help">The VAT ID field is required to identify the client in the system.</div>

        <input type="hidden" name="csrf" value="{{ csrf }}">

        <div class="form-row" style="margin-top:16px;">
          <span style="display:inline-block;min-width:140px;"></span>
          <button type="submit" class="btn">Sign in</button>
        </div>
      </form>
    </div>
    <div class="login-footer">
      Trouble signing in? Contact your system administrator.
    </div>
  </div>
</div>
{% endblock %}
