<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EnergoPlus{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <span class="brand-name">EnergoPlus</span>
      <span class="brand-tag">Client Portal</span>
    </div>
    {% block header_right %}{% endblock %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    {{ vendor.name }} · NIP {{ vendor.nip }} · {{ vendor.email }}
  </footer>
</body>
</html>
